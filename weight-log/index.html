<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Weight Log</title>
  <meta name="description" content="몸무게 기록과 그래프 — Log 시리즈" />
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Weight Log" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-series">Log</span>
      <h1>Weight Log</h1>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="설정">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm9.4 4.6-.1-2.2-2.1-.5a7.5 7.5 0 0 0-.7-1.6l1.1-1.9-1.5-1.6-1.9 1.1a7.5 7.5 0 0 0-1.6-.7L14.1 3.6h-2.2l-.5 2.1a7.5 7.5 0 0 0-1.6.7L7.9 5.3 6.3 6.8l1.1 1.9c-.3.5-.5 1-.7 1.6l-2.1.5v2.2l2.1.5c.2.6.4 1.1.7 1.6l-1.1 1.9 1.5 1.6 1.9-1.1c.5.3 1 .5 1.6.7l.5 2.1h2.2l.5-2.1c.6-.2 1.1-.4 1.6-.7l1.9 1.1 1.6-1.5-1.1-1.9c.3-.5.5-1 .7-1.6l2.1-.5Z"/></svg>
    </button>
  </header>

  <main>
    <section class="hero" aria-live="polite">
      <div class="hero-label">최근 체중</div>
      <div class="hero-value"><span id="hero-weight">–</span><small>kg</small></div>
      <div class="hero-sub" id="hero-sub">아직 기록이 없어요</div>
    </section>

    <section class="card">
      <div class="seg" role="tablist" id="period-tabs">
        <button role="tab" data-period="week" aria-selected="true">주간</button>
        <button role="tab" data-period="month">월간</button>
        <button role="tab" data-period="year">년간</button>
        <button role="tab" data-period="all">전체</button>
      </div>
      <div class="range-nav">
        <button class="icon-btn" id="btn-prev" aria-label="이전 기간">‹</button>
        <div id="range-label">–</div>
        <button class="icon-btn" id="btn-next" aria-label="다음 기간">›</button>
      </div>
      <div class="chart-host" id="chart"></div>
      <dl class="stats" id="stats"></dl>
    </section>

    <section class="actions">
      <button class="action" id="btn-manual">
        <span class="action-icon">✎</span>직접 입력
      </button>
      <label class="action">
        <span class="action-icon">📷</span>사진 찍기
        <input type="file" accept="image/*" capture="environment" id="input-camera" hidden />
      </label>
      <label class="action">
        <span class="action-icon">🖼</span>앨범에서
        <input type="file" accept="image/*" multiple id="input-album" hidden />
      </label>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>기록</h2>
        <span class="muted" id="list-count"></span>
      </div>
      <ul class="entries" id="entries"></ul>
    </section>
  </main>

  <!-- 직접 입력 / 수정 -->
  <dialog id="dlg-entry">
    <form method="dialog" id="form-entry">
      <h3 id="entry-title">몸무게 입력</h3>
      <label>체중 (kg)
        <input type="number" name="weight" step="0.01" min="10" max="400" inputmode="decimal" required />
      </label>
      <label>날짜와 시간
        <input type="datetime-local" name="date" required />
      </label>
      <label>메모 (선택)
        <input type="text" name="note" maxlength="60" placeholder="예: 아침 공복" />
      </label>
      <div class="dlg-actions">
        <button value="cancel" formnovalidate class="btn-ghost">취소</button>
        <button value="save" class="btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 사진 인식 결과 확인 -->
  <dialog id="dlg-photos">
    <form method="dialog" id="form-photos">
      <h3>사진에서 읽은 값 확인</h3>
      <p class="muted small" id="photo-hint">숫자가 틀리면 고쳐 주세요. 날짜는 사진 촬영 시각이에요.</p>
      <div id="photo-list" class="photo-list"></div>
      <div class="dlg-actions">
        <button value="cancel" formnovalidate class="btn-ghost">취소</button>
        <button value="save" class="btn-primary" id="btn-photos-save">모두 저장</button>
      </div>
    </form>
  </dialog>

  <!-- 설정 -->
  <dialog id="dlg-settings">
    <form method="dialog" id="form-settings">
      <h3>설정</h3>
      <label>목표 체중 (kg, 선택)
        <input type="number" name="goal" step="0.01" min="10" max="400" inputmode="decimal" />
      </label>
      <fieldset>
        <legend>사진 인식</legend>
        <p class="muted small">Claude API 키를 넣으면 체중계 숫자(LCD)를 훨씬 정확하게 읽어요. 비워 두면 기기 안의 OCR을 써요. 키는 이 기기에만 저장돼요.</p>
        <label>Claude API 키
          <input type="password" name="apiKey" autocomplete="off" placeholder="sk-ant-..." />
        </label>
        <label>모델
          <select name="model">
            <option value="claude-haiku-5-5">Haiku 5.5 (빠르고 저렴)</option>
            <option value="claude-sonnet-5-5">Sonnet 5.5</option>
          </select>
        </label>
      </fieldset>
      <fieldset>
        <legend>백업</legend>
        <div class="row-btns">
          <button type="button" id="btn-export-json">JSON 내보내기</button>
          <button type="button" id="btn-export-csv">CSV 내보내기</button>
          <label class="btn-like">가져오기
            <input type="file" accept=".json,.csv,application/json,text/csv" id="input-import" hidden />
          </label>
        </div>
      </fieldset>
      <div class="dlg-actions">
        <button type="button" id="btn-clear" class="btn-danger">전체 삭제</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate class="btn-ghost">닫기</button>
        <button value="save" class="btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
